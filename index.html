<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cheapest Thing on the Internet</title>
  <meta name="description" content="Generative AI made web pages almost free to build. This is about what that did to the far harder problem of being found.">

  <link rel="canonical" href="https://miint-sunny.github.io/the-cheapest-thing/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Cheapest Thing on the Internet">
  <meta property="og:description" content="Generative AI made web pages almost free to build. This is about what that did to the far harder problem of being found.">
  <meta property="og:url" content="https://miint-sunny.github.io/the-cheapest-thing/">
  <meta property="og:image" content="https://miint-sunny.github.io/the-cheapest-thing/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CreativeWork",
    "name": "The Cheapest Thing on the Internet",
    "author": { "@type": "Person", "name": "Miint" },
    "datePublished": "2026-08-16",
    "license": "https://creativecommons.org/licenses/by/4.0/",
    "inLanguage": ["en", "zh"],
    "url": "https://miint-sunny.github.io/the-cheapest-thing/"
  }
  </script>

  <link rel="preload" href="assets/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <a class="skip mono" href="#s1" data-copy="global.skipLink"></a>
  <button class="lang-toggle mono" type="button" data-copy="global.langToggle"></button>
  <nav class="rail" hidden><!-- ticks built by main.js --></nav>

  <main id="main">
    <h1 class="sr-only" data-copy="global.documentTitle"></h1>

    <!-- ================================================= 0 · Generate -->
    <section class="scr scr-ink" id="s0" tabindex="-1">
      <div class="gen">
        <div class="gen-mock" aria-hidden="true">
          <div class="mock-page">
            <div class="mock-nav">
              <span class="mock-logo skel"></span>
              <span class="mock-navlinks"><i class="skel"></i><i class="skel"></i><i class="skel"></i></span>
            </div>
            <div class="mock-hero">
              <p class="mock-headline" data-copy="s0.mockHeadline"></p>
              <span class="mock-line skel w70"></span>
              <span class="mock-line skel w50"></span>
              <span class="mock-cta"></span>
            </div>
            <div class="mock-media">
              <i class="mock-img m1"></i><i class="mock-img m2"></i><i class="mock-img m3"></i>
            </div>
            <div class="mock-cols">
              <span class="mock-line skel"></span><span class="mock-line skel w80"></span><span class="mock-line skel w60"></span>
              <span class="mock-line skel"></span><span class="mock-line skel w70"></span><span class="mock-line skel w80"></span>
              <span class="mock-line skel w90"></span><span class="mock-line skel w60"></span><span class="mock-line skel w70"></span>
            </div>
          </div>
        </div>

        <div class="gen-console mono">
          <div class="prompt-box">
            <span class="prompt-mark" aria-hidden="true">&gt;</span>
            <span class="prompt-text" data-copy="s0.promptText"></span>
            <span class="caret" aria-hidden="true"></span>
          </div>
          <button class="gen-btn mono" type="button">[&nbsp;<span data-copy="s0.button"></span>&nbsp;]</button>
        </div>

        <p class="gen-timer mono" hidden>
          <span data-copy="s0.timerLabel"></span>
          <b class="gen-timer-value">0.0s</b>
          <span class="gen-done" data-copy="s0.afterLabel" hidden></span>
        </p>
        <p class="scroll-cue mono" data-copy="global.scrollCue" hidden></p>
      </div>
    </section>

    <!-- ================================================ 1 · Production -->
    <section class="scr scr-paper" id="s1" tabindex="-1">
      <div class="wrap">
        <p class="eyebrow mono" data-copy="s1.eyebrow"></p>
        <h2 class="lead" data-copy="s1.lead"></h2>
        <p class="body measure" data-copy="s1.body"></p>
        <div class="bars"><!-- rows built by s1-cost.js --></div>
        <p class="caption mono"><span data-copy="s1.caption"></span><a class="cite" href="#s6">1</a></p>
        <p class="kicker measure" data-copy="s1.kicker"></p>
      </div>
    </section>

    <!-- ==================================================== 2 · Supply -->
    <section class="scr scr-paper" id="s2" tabindex="-1">
      <canvas class="flood" aria-hidden="true"></canvas>
      <div class="wrap s2-wrap">
        <div class="s2-copy">
          <p class="eyebrow mono" data-copy="s2.eyebrow"></p>
          <h2 class="lead" data-copy="s2.lead"></h2>
          <p class="body measure" data-copy="s2.body"></p>
        </div>
        <div class="s2-figure"><!-- figure built by s2-flood.js --></div>
        <p class="kicker measure" data-copy="s2.kicker"></p>
      </div>
    </section>

    <!-- ================================================ 3 · Visibility -->
    <section class="scr scr-system" id="s3" tabindex="-1">
      <div class="wrap">
        <p class="eyebrow mono" data-copy="s3.eyebrow"></p>
        <h2 class="lead" data-copy="s3.lead"></h2>
        <p class="body measure" data-copy="s3.sub"></p>

        <div class="serp-zone">
          <div class="serp" id="serp">
            <div class="serp-bar" aria-hidden="true"><span class="serp-dot"></span><span class="serp-input skel"></span></div>
            <ol class="serp-list"><!-- rows built by s3-rank.js --></ol>
          </div>

          <div class="serp-side">
            <div class="serp-actions">
              <button class="act" type="button" data-move="keywords" data-copy="s3.buttons.keywords"></button>
              <button class="act" type="button" data-move="title" data-copy="s3.buttons.title"></button>
              <button class="act" type="button" data-move="social" data-copy="s3.buttons.social"></button>
            </div>
            <p class="serp-hint" data-copy="s3.hint" hidden></p>
            <p class="serp-counter mono"><span data-copy="s3.counterLabel"></span> <b class="count">0</b></p>
            <div class="serp-diffs mono" aria-live="polite"><!-- diff lines appear here --></div>
            <p class="serp-result" data-copy="s3.result" hidden></p>
          </div>
        </div>

        <p class="kicker measure" data-copy="s3.kicker"></p>
      </div>
    </section>

    <!-- ================================================ 4 · Extraction -->
    <section class="scr scr-system" id="s4" tabindex="-1">
      <div class="wrap">
        <p class="eyebrow mono" data-copy="s4.eyebrow"></p>
        <h2 class="lead" data-copy="s4.lead"></h2>
        <p class="body measure" data-copy="s4.body"></p>

        <div class="answer-stage">
          <div class="answer-box">
            <div class="answer-inner">
              <div class="ans-skel" aria-hidden="true"><i class="skel"></i><i class="skel w80"></i><i class="skel w60"></i></div>
              <div class="ans-figs"><!-- three stats + shared chip, built by s4-answer.js --></div>
            </div>
          </div>
          <div class="serp-dock" aria-hidden="true"><!-- the s3 list is pushed down here --></div>
        </div>

        <div class="crawl">
          <h3 class="crawl-lead" data-copy="s4.crawlLead"></h3>
          <canvas class="crawl-field" aria-hidden="true"></canvas>
          <p class="crawl-caption" data-copy="s4.crawlCaption"></p>
          <div class="crawl-figure"><!-- crawlRatio figure built by s4-answer.js --></div>
        </div>

        <p class="s4-closing" data-copy="s4.closing"></p>
        <p class="kicker measure" data-copy="s4.kicker"></p>
      </div>
    </section>

    <!-- ===================================================== 5 · Close -->
    <section class="scr scr-ink" id="s5" tabindex="-1">
      <div class="wrap s5-wrap">
        <h2 class="lead" data-copy="s5.lead"></h2>
        <p class="body measure" data-copy="s5.body"></p>
        <details class="build">
          <summary class="mono" data-copy="s5.buildToggle"></summary>
          <dl class="build-rows mono"><!-- rows built by s5-close.js --></dl>
        </details>
        <p class="closing" data-copy="s5.closing"></p>
      </div>
    </section>

    <!-- =================================================== 6 · Credits -->
    <section class="scr scr-ink" id="s6" tabindex="-1">
      <div class="wrap s6-wrap">
        <div class="credits-grid">
          <div class="cred-col">
            <h2 class="cred-h mono" data-copy="s6.madeBy"></h2>
            <ul class="cred-made"><!-- built by s6-credits.js --></ul>
          </div>
          <div class="cred-col">
            <h2 class="cred-h mono" data-copy="s6.sources"></h2>
            <p class="cred-note" data-copy="s6.sourcesNote"></p>
            <ol class="refs" lang="en"><!-- built by s6-credits.js --></ol>
            <p class="cred-note" data-copy="s6.fonts"></p>
          </div>
          <div class="cred-col">
            <h2 class="cred-h mono" data-copy="s6.thisPage"></h2>
            <p class="cred-note cred-licence">
              <img class="cc-badge" src="assets/img/cc-by.svg" alt="Creative Commons Attribution 4.0" width="88" height="31">
              <span data-copy="s6.licence"></span>
            </p>
            <p class="cred-note" data-copy="s6.aiDisclosure"></p>
            <p class="cred-note"><a class="repo-link" href="https://github.com/Miint-Sunny/the-cheapest-thing" data-copy="s6.repo"></a></p>
          </div>
        </div>

        <div class="og-zone">
          <p class="og-label" data-copy="s6.ogLabel"></p>
          <div class="og-card"><!-- rendered live from this page's own meta tags --></div>
          <p class="index-status mono" data-copy="s6.indexStatus"></p>
        </div>
      </div>
    </section>

  </main>

  <div class="debug mono" hidden></div>

  <script defer src="assets/js/copy.js"></script>
  <script defer src="assets/js/screens/s0-generate.js"></script>
  <script defer src="assets/js/screens/s1-cost.js"></script>
  <script defer src="assets/js/screens/s2-flood.js"></script>
  <script defer src="assets/js/screens/s3-rank.js"></script>
  <script defer src="assets/js/screens/s4-answer.js"></script>
  <script defer src="assets/js/screens/s5-close.js"></script>
  <script defer src="assets/js/screens/s6-credits.js"></script>
  <script defer src="assets/js/main.js"></script>
</body>
</html>
